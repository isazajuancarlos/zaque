# Endurecimiento de kernel — Xiliux / hope. Copia versionada del que va en
# /etc/sysctl.d/99-xiliux-hardening.conf (ver comando.txt). Capa de runtime que NO
# depende de Secure Boot. Compatible con NordVPN/AdGuard/libvirt (medido).
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.kexec_load_disabled=1
kernel.yama.ptrace_scope=1
kernel.unprivileged_bpf_disabled=2
net.core.bpf_jit_harden=2
